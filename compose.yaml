name: babybuddy

x-daemonless:
  title: "Baby Buddy"
  icon: ":material-baby-carriage:"
  category: "Productivity"
  description: "Baby Buddy helps caregivers track sleep, feedings, diaper changes, tummy time and more, to learn about and predict baby's needs without (as much) guess work."
  upstream_url: "https://github.com/babybuddy/babybuddy"
  web_url: "https://docs.baby-buddy.net/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      CSRF_TRUSTED_ORIGINS:
        desc: "Comma-separated origins (e.g. https://baby.example.com) when served behind a reverse proxy over HTTPS"
        optional: true
      SECRET_KEY:
        desc: "Django secret key; generated once into /config/.secretkey when unset"
        optional: true
    volumes:
      /config: "Database (db.sqlite3), uploads (media/) and the secret key"
    ports:
      8000: "Web UI (first login admin / admin: change it right away)"

services:
  babybuddy:
    image: ghcr.io/daemonless/babybuddy:latest
    container_name: babybuddy
    # "always", not "unless-stopped": FreeBSD's podman rc.d only auto-starts
    # containers with restart-policy=always at boot (needs podman_enable=YES).
    restart: always

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC

    volumes:
      - /path/to/containers/babybuddy:/config

    ports:
      - 8000:8000
